<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><style>:root{color-scheme:light;--pimi-bg:#faf6f5;--pimi-surface:#f0e8e8;--pimi-fg:#2c2529;--pimi-muted:#695c62;--pimi-border:#e8dfe0;--pimi-accent:#382e33;--pimi-accent-fg:#fffafc;--pimi-font:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;--pimi-mono:SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace}:where(html){background:var(--pimi-bg);color:var(--pimi-fg);font-family:var(--pimi-font)}:where(body){margin:0;padding:16px}</style><script>(function(){var send=function(){var height=Math.ceil(document.documentElement.getBoundingClientRect().height);var message={pimiPreviewHeight:height};if(window.ReactNativeWebView){window.ReactNativeWebView.postMessage(JSON.stringify(message))}else{parent.postMessage(message,"*")}};new ResizeObserver(send).observe(document.documentElement);addEventListener("load",send)})();</script><title>Deployment retry budget</title><style>body{font:14px system-ui;margin:0;padding:18px;color:var(--pimi-fg);background:var(--pimi-surface)}h2{font-size:18px;letter-spacing:-.4px;margin:0 0 18px}label{display:flex;justify-content:space-between;margin:15px 0 8px}input{width:100%;accent-color:var(--pimi-accent)}.metrics{display:flex;gap:35px;margin:22px 0}.metrics strong{display:block;font-size:29px;font-weight:500}.metrics small{opacity:.6}svg{width:100%;height:105px}path{stroke:var(--pimi-accent);stroke-width:2;fill:none}circle{fill:var(--pimi-accent)}.note{opacity:.6;font-size:11px}</style><h2>Keep retries within budget</h2><label for="retries">Retries per deploy <output id="count">3</output></label><input id="retries" type="range" min="1"
